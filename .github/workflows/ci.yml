name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev libcurl4-openssl-dev

      - name: Verify Code Formatting
        run: v fmt -verify .

      - name: Run Test Suite
        run: v -stats test .

      - name: Build & Run 30-Module Showcase
        run: v -prod run main.v
